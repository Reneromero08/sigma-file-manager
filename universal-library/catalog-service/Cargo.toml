[package]
name = "universal-library-catalog"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Local catalog and CLI for the Sigma Universal Library"
repository = "https://github.com/Reneromero08/sigma-file-manager"
publish = false

[lib]
name = "universal_library_catalog"
path = "src/lib.rs"

[[bin]]
name = "ulib"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.0", features = ["aiff", "mp3"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.0"
