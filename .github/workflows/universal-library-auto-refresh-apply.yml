name: Universal Library auto-refresh apply

on:
  pull_request:
    branches:
      - product
    paths:
      - 'scripts/apply-auto-refresh-integration.py'
      - 'universal-library/extension/**'
      - '.github/workflows/universal-library-auto-refresh-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/universal-library-auto-refresh' || github.ref_name == 'feat/universal-library-auto-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-auto-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply integration patch
        run: python3 scripts/apply-auto-refresh-integration.py
      - name: Canonical formatting
        run: npx eslint --fix universal-library/extension/src/index.js universal-library/extension/src/auto-refresh.js universal-library/extension/tests/bootstrap.node.mjs universal-library/extension/tests/auto-refresh.node.mjs
      - name: Validate extension syntax
        run: npm --prefix universal-library/extension run check
      - name: Run extension tests
        run: npm --prefix universal-library/extension test
      - name: Validate scoped lint
        run: npx eslint universal-library/extension/src/index.js universal-library/extension/src/auto-refresh.js universal-library/extension/tests/bootstrap.node.mjs universal-library/extension/tests/auto-refresh.node.mjs universal-library/extension/tests/managed-binary-manifest.node.mjs
      - name: Remove one-shot files
        run: git rm scripts/apply-auto-refresh-integration.py .github/workflows/universal-library-auto-refresh-apply.yml
      - name: Commit validated integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-library/extension
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 1
          fi
          git commit -m 'Integrate opt-in automatic catalog refresh'
          git push origin HEAD:feat/universal-library-auto-refresh
