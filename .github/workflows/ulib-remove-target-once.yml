name: Remove committed Universal Library build artifacts

on:
  push:
    branches:
      - feat/universal-library-organization
    paths:
      - ".github/workflows/ulib-remove-target-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-organization
          fetch-depth: 0
      - name: Remove generated Rust output from Git history tip
        run: |
          git rm -r --cached universal-library/catalog-service/target
          rm .github/workflows/ulib-remove-target-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-library/catalog-service/.gitignore .github/workflows
          git commit -m "build: remove generated catalog service artifacts"
          git push origin HEAD:feat/universal-library-organization
