name: Universal Library audition apply

on:
  pull_request:
    branches:
      - product
    paths:
      - 'scripts/apply-audio-audition-workspace.py'
      - 'universal-library/extension/**'
      - '.github/workflows/universal-library-audition-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/universal-library-audio-audition-v2' || github.ref_name == 'feat/universal-library-audio-audition-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-audio-audition-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply workspace patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-audio-audition-workspace.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '.ul-asset-card.is-selected { border-color: hsl(267 80% 66% / 0.72); box-shadow: 0 0 0 1px hsl(267 80% 66% / 0.3), 0 18px 38px hsl(220 30% 4% / 0.35); }',
              '.ul-asset-card.is-selected { border-color: var(--ul-accent); box-shadow: 0 0 0 2px var(--ul-accent-soft); }',
          )
          text = text.replace(
              '.ul-offline-badge { position: absolute; right: 8px; bottom: 8px; padding: 3px 6px; border: 1px solid hsl(2 70% 58% / 0.5); border-radius: 999px; color: hsl(2 80% 76%); background: hsl(2 55% 20% / 0.78); font-size: 8px; text-transform: uppercase; }',
              '.ul-offline-badge { position: absolute; top: 8px; right: 8px; padding: 3px 6px; border-radius: 999px; color: hsl(3 90% 80%); background: hsl(3 65% 25% / 0.75); font-size: 8px; text-transform: uppercase; }',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/apply-audio-audition-workspace.py
      - name: Format changed JavaScript
        run: npx eslint --fix universal-library/extension/ui/workspace.js universal-library/extension/ui/audio-player.js universal-library/extension/src/workspace-provider.js universal-library/extension/tests/audio-player.node.mjs universal-library/extension/tests/workspace-audio-url.node.mjs
      - name: Validate extension syntax
        run: npm --prefix universal-library/extension run check
      - name: Run extension tests
        run: |
          set +e
          npm --prefix universal-library/extension test > audition-test-output.txt 2>&1
          status=$?
          cat audition-test-output.txt
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -f --ignore-unmatch scripts/apply-audio-audition-workspace.py .github/workflows/universal-library-audition-apply.yml audition-patch-output.txt
            git add universal-library/extension audition-test-output.txt
            git commit -m 'Capture generated audition workspace test failure'
            git push origin HEAD:feat/universal-library-audio-audition-v2
            exit "$status"
          fi
          rm audition-test-output.txt
      - name: Validate scoped lint
        run: npx eslint universal-library/extension/ui/workspace.js universal-library/extension/ui/audio-player.js universal-library/extension/src/workspace-provider.js universal-library/extension/tests/audio-player.node.mjs universal-library/extension/tests/workspace-audio-url.node.mjs universal-library/extension/tests/workspace.node.mjs
      - name: Remove one-shot files
        run: git rm -f --ignore-unmatch scripts/apply-audio-audition-workspace.py .github/workflows/universal-library-audition-apply.yml audition-patch-output.txt
      - name: Commit validated workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-library/extension
          if git diff --cached --quiet; then
            echo 'No workspace changes to commit.'
            exit 1
          fi
          git commit -m 'Integrate secure audio audition workspace'
          git push origin HEAD:feat/universal-library-audio-audition-v2
