name: Format Universal Library indexer

on:
  push:
    branches:
      - feat/universal-library-indexer
    paths:
      - ".github/workflows/universal-library-indexer-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-library-indexer

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format catalog service
        run: cargo fmt --manifest-path universal-library/catalog-service/Cargo.toml

      - name: Commit formatter output
        run: |
          if [ -z "$(git status --porcelain -- universal-library/catalog-service)" ]; then
            echo "Catalog service is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-library/catalog-service
          git commit -m "style: format Universal Library indexer"
          git push origin HEAD:feat/universal-library-indexer
