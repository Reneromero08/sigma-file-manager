name: Universal Library image thumbnails apply

on:
  pull_request:
    branches:
      - product
    paths:
      - 'scripts/apply-image-thumbnail-workspace.py'
      - 'universal-library/extension/**'
      - '.github/workflows/universal-library-image-thumbnails-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/universal-library-image-thumbnails' || github.ref_name == 'feat/universal-library-image-thumbnails'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-image-thumbnails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply thumbnail integration
        run: python3 scripts/apply-image-thumbnail-workspace.py
      - name: Canonical formatting
        run: npx eslint --fix universal-library/extension/ui/workspace.js universal-library/extension/ui/image-preview.js universal-library/extension/src/workspace-provider.js universal-library/extension/tests/image-preview.node.mjs universal-library/extension/tests/workspace-asset-url.node.mjs universal-library/extension/tests/workspace-image-preview.node.mjs universal-library/extension/tests/managed-binary-manifest.node.mjs
      - name: Validate extension syntax
        run: npm --prefix universal-library/extension run check
      - name: Run extension tests
        run: npm --prefix universal-library/extension test
      - name: Validate scoped lint
        run: npx eslint universal-library/extension/ui/workspace.js universal-library/extension/ui/image-preview.js universal-library/extension/src/workspace-provider.js universal-library/extension/tests/image-preview.node.mjs universal-library/extension/tests/workspace-asset-url.node.mjs universal-library/extension/tests/workspace-image-preview.node.mjs universal-library/extension/tests/managed-binary-manifest.node.mjs
      - name: Remove one-shot files
        run: git rm scripts/apply-image-thumbnail-workspace.py .github/workflows/universal-library-image-thumbnails-apply.yml
      - name: Commit validated integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add universal-library/extension
          git commit -m 'Integrate lazy scoped image thumbnails'
          git push origin HEAD:feat/universal-library-image-thumbnails
