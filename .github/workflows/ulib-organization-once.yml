name: Validate and wire organization layer

on:
  push:
    branches:
      - feat/universal-library-organization
    paths:
      - ".github/workflows/ulib-organization-once.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-organization
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 universal-library/catalog-service/wire_organization.py
      - run: cargo fmt --manifest-path universal-library/catalog-service/Cargo.toml
      - run: cargo clippy --manifest-path universal-library/catalog-service/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path universal-library/catalog-service/Cargo.toml
      - name: Commit validated source and remove one-shot files
        run: |
          rm .github/workflows/ulib-organization-once.yml
          rm .github/workflows/universal-library-organization-wire.yml
          rm universal-library/catalog-service/wire_organization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-library/catalog-service .github/workflows
          git commit -m "feat: validate Universal Library organization layer"
          git push origin HEAD:feat/universal-library-organization
