name: Apply bundled Universal Library bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - feat/universal-library-bundled-extension
    paths:
      - ".github/workflows/universal-library-bundled-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-bundled-extension
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: python3 scripts/apply-bundled-universal-library-bootstrap.py
      - run: npm ci
      - run: npx eslint src/composables/use-init.ts src/modules/extensions/bundled-extension-bootstrap.ts src/modules/extensions/bundled-extension-sync.ts src/modules/extensions/__tests__/bundled-extension-sync.test.ts --fix
      - run: npm run ts && npm run lint:check && npm run test:unit:run
      - name: Commit validated bootstrap
        run: |
          rm .github/workflows/universal-library-bundled-bootstrap.yml
          rm scripts/apply-bundled-universal-library-bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/universal-library-bundled-bootstrap.yml scripts/apply-bundled-universal-library-bootstrap.py src/composables/use-init.ts src/modules/extensions
          git commit -m "feat: bootstrap bundled Universal Library extension"
          git push origin HEAD:feat/universal-library-bundled-extension
