name: Capture Universal Library bridge lint

on:
  push:
    branches:
      - feat/universal-library-sigma-bridge
    paths:
      - ".github/workflows/universal-library-bridge-lint-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-library-sigma-bridge

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture scoped ESLint output
        run: |
          set +e
          npx eslint universal-library/extension --max-warnings 0 > universal-library/extension/lint-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> universal-library/extension/lint-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-library/extension/lint-diagnostic.txt
          git commit -m "chore: capture Universal Library bridge lint diagnostic"
          git push origin HEAD:feat/universal-library-sigma-bridge
