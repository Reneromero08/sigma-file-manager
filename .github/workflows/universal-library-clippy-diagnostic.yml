name: Capture Universal Library Clippy diagnostic

on:
  push:
    branches:
      - feat/universal-library-catalog
    paths:
      - ".github/workflows/universal-library-clippy-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-library-catalog

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Capture diagnostic
        run: |
          set +e
          cargo clippy --manifest-path universal-library/catalog-service/Cargo.toml --all-targets -- -D warnings > universal-library/catalog-service/clippy-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> universal-library/catalog-service/clippy-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-library/catalog-service/clippy-diagnostic.txt
          git commit -m "chore: capture catalog Clippy diagnostic"
          git push origin HEAD:feat/universal-library-catalog
