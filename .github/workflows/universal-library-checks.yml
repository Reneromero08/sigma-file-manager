name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  resolve-audio-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-library-audio-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-audio-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - name: Download published ulib 0.2 custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ulib-release
          mkdir -p /tmp/ulib-release
          gh release download ulib-v0.2.0 \
            --repo Reneromero08/sigma-file-manager \
            --pattern release-manifest.json \
            --pattern SHA256SUMS \
            --dir /tmp/ulib-release
      - name: Generate managed binary declaration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          extension = Path('universal-library/extension')
          release_tag = 'ulib-v0.2.0'
          release_source = Path('/tmp/ulib-release')
          release_target = extension / 'release' / release_tag
          release_target.mkdir(parents=True, exist_ok=True)

          release_manifest = json.loads((release_source / 'release-manifest.json').read_text())
          if release_manifest.get('schemaVersion') != 1:
              raise SystemExit('Unsupported release manifest schema')
          assets = release_manifest.get('assets')
          if not isinstance(assets, list) or len(assets) != 2:
              raise SystemExit('Expected exactly two platform assets')
          by_platform = {f"{asset['platform']}:{asset['arch']}": asset for asset in assets}
          if set(by_platform) != {'linux:x64', 'windows:x64'}:
              raise SystemExit(f'Unexpected release assets: {sorted(by_platform)}')
          if {asset['version'] for asset in assets} != {'0.2.0'}:
              raise SystemExit('Published assets do not match 0.2.0')

          checksums_text = (release_source / 'SHA256SUMS').read_text()
          checksums = {}
          for line in checksums_text.splitlines():
              if line.strip():
                  digest, filename = line.split(maxsplit=1)
                  checksums[filename.lstrip('*')] = digest
          for asset in assets:
              if checksums.get(asset['archive']) != asset['sha256']:
                  raise SystemExit(f"Checksum mismatch for {asset['archive']}")

          package_path = extension / 'package.json'
          package = json.loads(package_path.read_text())
          package['version'] = '0.5.0'
          package['binaries'] = [{
              'id': 'universal-library-catalog',
              'name': 'Universal Library Catalog',
              'version': '0.2.0',
              'executable': 'ulib',
              'repository': 'https://github.com/Reneromero08/sigma-file-manager',
              'platforms': ['linux', 'windows'],
              'assets': [
                  {
                      'platform': platform,
                      'arch': ['x64'],
                      'downloadUrl': (
                          'https://github.com/Reneromero08/sigma-file-manager/releases/download/'
                          f"{release_tag}/{by_platform[f'{platform}:x64']['archive']}"
                      ),
                      'integrity': f"sha256:{by_platform[f'{platform}:x64']['sha256']}",
                      'archive': True,
                      'executable': by_platform[f'{platform}:x64']['executable'],
                  }
                  for platform in ('linux', 'windows')
              ],
          }]
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          (release_target / 'release-manifest.json').write_text(
              json.dumps(release_manifest, indent=2, sort_keys=True) + '\n'
          )
          (release_target / 'SHA256SUMS').write_text(checksums_text)

          test_path = extension / 'tests/managed-binary-manifest.node.mjs'
          test_text = test_path.read_text()
          test_text = test_text.replace("const releaseTag = 'ulib-v0.1.0';", "const releaseTag = 'ulib-v0.2.0';")
          test_text = test_text.replace("assert.equal(manifest.version, '0.4.0');", "assert.equal(manifest.version, '0.5.0');")
          test_text = test_text.replace("assert.equal(binary.version, '0.1.0');", "assert.equal(binary.version, '0.2.0');")
          test_path.write_text(test_text)

          bundled_path = extension / 'BUNDLED_INSTALLATION.md'
          if bundled_path.exists():
              bundled_path.write_text(bundled_path.read_text().replace('`0.4.0`', '`0.5.0`', 1))
          PY
      - run: npm ci
      - run: |
          node --check universal-library/extension/src/workspace-provider.js
          node --check universal-library/extension/ui/audio-ui.js
          node --check universal-library/extension/ui/workspace.js
          node --test universal-library/extension/tests/*.node.mjs
          npx eslint universal-library/extension --max-warnings 0
      - run: |
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bind waveform workspace to managed ulib 0.2"
          git push origin HEAD:feat/universal-library-audio-workspace
