name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  apply-scoped-asset-url:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/scoped-asset-url-api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scoped-asset-url-api
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: python3 scripts/apply-scoped-asset-url-api.py
      - run: npm ci
      - run: npx eslint src/modules/extensions/api/create-fs-api.ts src/modules/extensions/api/__tests__/create-fs-api.test.ts src/modules/extensions/runtime/api-method-map.ts --fix
      - run: npm run ts && npm run lint:check && npm run test:unit:run
      - run: |
          rm scripts/apply-scoped-asset-url-api.py
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose scoped streamable asset URLs"
          git push origin HEAD:feat/scoped-asset-url-api
