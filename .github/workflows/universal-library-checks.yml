name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  diagnose-pr10:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-library-bundled-extension'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-bundled-extension
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: |
          mkdir -p diagnostics
          set +e
          npm run ts > diagnostics/pr10-ts.txt 2>&1
          echo $? > diagnostics/pr10-ts.status
          npm run lint:check > diagnostics/pr10-lint.txt 2>&1
          echo $? > diagnostics/pr10-lint.status
          npm run test:unit:run > diagnostics/pr10-tests.txt 2>&1
          echo $? > diagnostics/pr10-tests.status
          set -e
      - run: |
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/universal-library-checks.yml diagnostics
          git commit -m "test: capture remaining PR10 validation report"
          git push origin HEAD:feat/universal-library-bundled-extension
