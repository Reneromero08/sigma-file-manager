name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  extension-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: node --test universal-library/extension/tests/*.node.mjs

  fix-pr10-lint:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-library-bundled-extension'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-bundled-extension
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/composables/use-init.ts')
          text = path.read_text()
          old = "              }\n              await extensionsStorageStore.saveStorageData();"
          new = "              }\n\n              await extensionsStorageStore.saveStorageData();"
          if text.count(old) != 1:
              raise SystemExit(f'expected one lint marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/composables/use-init.ts .github/workflows/universal-library-checks.yml
          git commit -m "style: finalize bundled extension startup formatting"
          git push origin HEAD:feat/universal-library-bundled-extension
