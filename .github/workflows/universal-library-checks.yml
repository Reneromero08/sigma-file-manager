name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  fix-pr10-tests:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-library-bundled-extension'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-bundled-extension
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/composables/__tests__/use-init.test.ts')
          text = path.read_text()
          text = text.replace(
              '''  appWindowInitMainWindowStateListenersMock,
            applyLaunchAtStartupPreferenceMock,''',
              '''  appWindowInitMainWindowStateListenersMock,
            applyLaunchAtStartupPreferenceMock,
            bootstrapBundledUniversalLibraryMock,''',
              1,
          )
          text = text.replace(
              '''  extensionsInitMock,
            getDirEntryMock,''',
              '''  extensionsInitMock,
            extensionsStorageSaveMock,
            getDirEntryMock,''',
              1,
          )
          text = text.replace(
              '''  appWindowInitMainWindowStateListenersMock: vi.fn(),
            applyLaunchAtStartupPreferenceMock: vi.fn(),''',
              '''  appWindowInitMainWindowStateListenersMock: vi.fn(),
            applyLaunchAtStartupPreferenceMock: vi.fn(),
            bootstrapBundledUniversalLibraryMock: vi.fn(),''',
              1,
          )
          text = text.replace(
              '''  extensionsInitMock: vi.fn(),
            getDirEntryMock: vi.fn(),''',
              '''  extensionsInitMock: vi.fn(),
            extensionsStorageSaveMock: vi.fn(),
            getDirEntryMock: vi.fn(),''',
              1,
          )
          extension_mock = '''vi.mock('@/stores/runtime/extensions', () => ({
            useExtensionsStore: () => ({
              init: extensionsInitMock,
            }),
          }));
          '''
          replacement = extension_mock + '''
          vi.mock('@/stores/storage/extensions', () => ({
            useExtensionsStorageStore: () => ({
              extensionsData: { installedExtensions: {} },
              saveStorageData: extensionsStorageSaveMock,
            }),
          }));

          vi.mock('@/modules/extensions/bundled-extension-bootstrap', () => ({
            bootstrapBundledUniversalLibrary: bootstrapBundledUniversalLibraryMock,
          }));

          vi.mock('@/modules/extensions/bundled-extension-sync', () => ({
            BUNDLED_UNIVERSAL_LIBRARY_ID: 'reneromero08.universal-library',
          }));
          '''
          if text.count(extension_mock) != 1:
              raise SystemExit('extensions runtime mock marker missing')
          text = text.replace(extension_mock, replacement, 1)
          text = text.replace(
              '''    applyLaunchAtStartupPreferenceMock.mockReset().mockResolvedValue(undefined);
              archiveJobsEnsureEventListenersMock''',
              '''    applyLaunchAtStartupPreferenceMock.mockReset().mockResolvedValue(undefined);
              bootstrapBundledUniversalLibraryMock.mockReset().mockResolvedValue('current');
              archiveJobsEnsureEventListenersMock''',
              1,
          )
          text = text.replace(
              '''    extensionsInitMock.mockReset().mockResolvedValue(undefined);
              getDirEntryMock''',
              '''    extensionsInitMock.mockReset().mockResolvedValue(undefined);
              extensionsStorageSaveMock.mockReset().mockResolvedValue(undefined);
              getDirEntryMock''',
              1,
          )
          path.write_text(text)
          PY
      - run: npm ci
      - run: npx eslint src/modules/extensions/bundled-extension-sync.ts src/composables/__tests__/use-init.test.ts --fix
      - run: npm run ts && npm run lint:check && npm run test:unit:run
      - run: |
          rm -rf diagnostics
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: cover bundled extension startup initialization"
          git push origin HEAD:feat/universal-library-bundled-extension
