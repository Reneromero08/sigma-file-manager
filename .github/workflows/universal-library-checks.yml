name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  canonicalize-pr10:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-library-bundled-extension'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-bundled-extension
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npx eslint src/composables/use-init.ts src/modules/extensions/bundled-extension-bootstrap.ts src/modules/extensions/bundled-extension-sync.ts src/modules/extensions/__tests__/bundled-extension-sync.test.ts --fix
      - run: npm run ts && npm run lint:check && npm run test:unit:run
      - run: |
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: canonicalize bundled extension integration"
          git push origin HEAD:feat/universal-library-bundled-extension
