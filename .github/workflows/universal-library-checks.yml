name: Universal Library checks

on:
  pull_request:
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"
  push:
    branches:
      - product
    paths:
      - "universal-library/**"
      - ".github/workflows/universal-library-checks.yml"

permissions:
  contents: write

jobs:
  extension-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: |
          node --check universal-library/extension/src/index.js
          node --check universal-library/extension/src/catalog-client.js
          node --check universal-library/extension/src/catalog-bridge.js
          node --check universal-library/extension/src/workspace-provider.js
          node --check universal-library/extension/ui/workspace.js
      - run: node --test universal-library/extension/tests/*.node.mjs
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'universal-library/extension/package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const required = ['id', 'name', 'version', 'repository', 'license', 'extensionType', 'permissions', 'engines'];
          const missing = required.filter(key => manifest[key] === undefined);
          if (missing.length > 0) throw new Error(`Missing manifest fields: ${missing.join(', ')}`);
          if (manifest.extensionType !== 'api') throw new Error('Universal Library must remain an API extension.');
          if (!manifest.permissions.includes('fs.read')) throw new Error('Read permission is required.');
          if (!manifest.permissions.includes('shell')) throw new Error('Shell permission is required.');
          if (manifest.permissions.includes('fs.write')) throw new Error('Source write permission is forbidden.');
          if (manifest.main !== 'src/index.js') throw new Error('Unexpected extension entry point.');
          NODE
      - run: |
          python3 <<'PY'
          import pathlib, sqlite3
          migration = pathlib.Path('universal-library/catalog/0001_initial.sql').read_text()
          connection = sqlite3.connect(':memory:')
          connection.executescript(migration)
          expected = {'schema_migrations','roots','assets','locations','tags','asset_tags','collections','collection_items','asset_metadata','asset_relations','previews','saved_queries','analysis_jobs','audit_log'}
          actual = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type = 'table'")}
          missing = expected - actual
          if missing: raise SystemExit(f'Migration did not create tables: {sorted(missing)}')
          if connection.execute('PRAGMA user_version').fetchone()[0] != 1: raise SystemExit('Unexpected schema version')
          PY

  catalog-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: universal-library/catalog-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: universal-library/catalog-service
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: |
          database="$RUNNER_TEMP/universal-library.sqlite3"
          cargo run --quiet -- --database "$database" init | tee "$RUNNER_TEMP/init.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('init.json').read_text())
          assert payload['ok'] is True
          assert payload['data']['status'] == 'ok'
          assert payload['data']['schemaVersion'] == 1
          PY

  finalize-pr10:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/universal-library-bundled-extension'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-library-bundled-extension
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/composables/use-init.ts')
          text = path.read_text()
          old = """              if (refreshed) {
                refreshed.localSourcePath = previousSourcePath;
              }
              await extensionsStorageStore.saveStorageData();
          """
          new = """              if (refreshed) {
                refreshed.localSourcePath = previousSourcePath;
              }

              await extensionsStorageStore.saveStorageData();
          """
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/pr10-eslint-fix.yml
          rm -f .github/workflows/pr10-finalize.yml
          rm -f diagnostics/pr10-eslint.txt
          rmdir diagnostics 2>/dev/null || true
          git show origin/product:.github/workflows/universal-library-checks.yml > .github/workflows/universal-library-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize bundled extension integration"
          git push origin HEAD:feat/universal-library-bundled-extension
