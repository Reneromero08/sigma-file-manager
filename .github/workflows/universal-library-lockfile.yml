name: Generate Universal Library lockfile

on:
  push:
    branches:
      - feat/universal-library-catalog
    paths:
      - "universal-library/catalog-service/Cargo.toml"
      - ".github/workflows/universal-library-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-library-catalog

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path universal-library/catalog-service/Cargo.toml

      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- universal-library/catalog-service/Cargo.lock)" ]; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-library/catalog-service/Cargo.lock
          git commit -m "build: lock catalog service dependencies"
          git push origin HEAD:feat/universal-library-catalog
