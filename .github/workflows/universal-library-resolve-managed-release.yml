name: Resolve Universal Library managed release

on:
  workflow_dispatch:
  push:
    branches:
      - feat/universal-library-managed-catalog
    paths:
      - ".github/workflows/universal-library-resolve-managed-release.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out managed catalog branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-library-managed-catalog

      - name: Download published release custody files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ulib-release
          mkdir -p /tmp/ulib-release
          gh release download ulib-v0.1.0 \
            --repo Reneromero08/sigma-file-manager \
            --pattern release-manifest.json \
            --pattern SHA256SUMS \
            --dir /tmp/ulib-release

      - name: Generate managed binary declaration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          branch = Path('.')
          extension = branch / 'universal-library/extension'
          release_tag = 'ulib-v0.1.0'
          release_source = Path('/tmp/ulib-release')
          release_target = extension / 'release' / release_tag
          release_target.mkdir(parents=True, exist_ok=True)

          release_manifest_path = release_source / 'release-manifest.json'
          checksums_path = release_source / 'SHA256SUMS'
          release_manifest = json.loads(release_manifest_path.read_text(encoding='utf-8'))
          if release_manifest.get('schemaVersion') != 1:
              raise SystemExit('Unsupported release manifest schema')

          assets = release_manifest.get('assets')
          if not isinstance(assets, list) or len(assets) != 2:
              raise SystemExit('Expected exactly two published platform assets')
          by_platform = {f"{asset['platform']}:{asset['arch']}": asset for asset in assets}
          if set(by_platform) != {'linux:x64', 'windows:x64'}:
              raise SystemExit(f'Unexpected release assets: {sorted(by_platform)}')
          if {asset['version'] for asset in assets} != {'0.1.0'}:
              raise SystemExit('Published asset versions do not match 0.1.0')

          checksum_entries = {}
          for line in checksums_path.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, filename = line.split(maxsplit=1)
              filename = filename.lstrip('*')
              checksum_entries[filename] = digest
          for asset in assets:
              if checksum_entries.get(asset['archive']) != asset['sha256']:
                  raise SystemExit(f"Checksum custody mismatch for {asset['archive']}")

          package_path = extension / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.4.0'
          package['binaries'] = [{
              'id': 'universal-library-catalog',
              'name': 'Universal Library Catalog',
              'version': '0.1.0',
              'executable': 'ulib',
              'repository': 'https://github.com/Reneromero08/sigma-file-manager',
              'platforms': ['linux', 'windows'],
              'assets': [
                  {
                      'platform': platform,
                      'arch': ['x64'],
                      'downloadUrl': (
                          'https://github.com/Reneromero08/sigma-file-manager/releases/download/'
                          f'{release_tag}/{by_platform[f"{platform}:x64"]["archive"]}'
                      ),
                      'integrity': f'sha256:{by_platform[f"{platform}:x64"]["sha256"]}',
                      'archive': True,
                      'executable': by_platform[f'{platform}:x64']['executable'],
                  }
                  for platform in ('linux', 'windows')
              ],
          }]
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          (release_target / 'release-manifest.json').write_text(
              json.dumps(release_manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          (release_target / 'SHA256SUMS').write_text(
              checksums_path.read_text(encoding='utf-8'),
              encoding='utf-8',
          )

          workspace_path = extension / 'ui/workspace.js'
          workspace = workspace_path.read_text(encoding='utf-8')
          old_workspace = "await sigma.commands.executeCommand('configure-catalog');"
          new_workspace = "await sigma.commands.executeCommand('catalog-health');"
          if workspace.count(old_workspace) != 1:
              raise SystemExit('Workspace Catalog toolbar action marker was not unique')
          workspace_path.write_text(workspace.replace(old_workspace, new_workspace), encoding='utf-8')

          workspace_test_path = extension / 'tests/workspace.node.mjs'
          workspace_test = workspace_test_path.read_text(encoding='utf-8')
          old_title = "test('uses existing command palette actions for indexing and configuration'"
          new_title = "test('uses existing command palette actions for indexing and catalog status'"
          old_assertion = "call.commandId === 'configure-catalog'"
          new_assertion = "call.commandId === 'catalog-health'"
          if workspace_test.count(old_title) != 1 or workspace_test.count(old_assertion) != 1:
              raise SystemExit('Workspace toolbar test markers were not unique')
          workspace_test = workspace_test.replace(old_title, new_title).replace(old_assertion, new_assertion)
          workspace_test_path.write_text(workspace_test, encoding='utf-8')

          bridge_path = extension / 'src/catalog-bridge.js'
          bridge = bridge_path.read_text(encoding='utf-8')
          old_bridge = "        `Executable: ${configuration.executablePath}`,"
          new_bridge = (
              "        `Executable source: ${configuration.executableSource ?? 'unavailable'}`,\n"
              "        `Executable: ${configuration.executablePath ?? 'unavailable'}`,"
          )
          if bridge.count(old_bridge) != 1:
              raise SystemExit('Catalog health executable marker was not unique')
          bridge_path.write_text(bridge.replace(old_bridge, new_bridge), encoding='utf-8')
          PY

      - name: Install locked extension test dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Validate generated managed extension
        run: |
          npm ci
          node --check universal-library/extension/src/index.js
          node --check universal-library/extension/src/catalog-client.js
          node --check universal-library/extension/src/catalog-bridge.js
          node --check universal-library/extension/src/workspace-provider.js
          node --check universal-library/extension/ui/workspace.js
          node --test universal-library/extension/tests/*.node.mjs
          npx eslint universal-library/extension --max-warnings 0

      - name: Commit verified managed release
        run: |
          set -euo pipefail
          rm .github/workflows/universal-library-resolve-managed-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/universal-library-resolve-managed-release.yml \
            universal-library/extension
          git commit -m "feat: declare verified managed ulib release"
          git push origin HEAD:feat/universal-library-managed-catalog
